name: Build & Push Caddy Multi-Arch

on:
  schedule:
    # 北京时间每周一 02:00 → UTC 周日 18:00
    - cron: '0 18 * * 0'
  workflow_dispatch: # 支持手动触发

env:
  # 关闭调试日志，防止开启debug后secret泄露
  ACTIONS_STEP_DEBUG: false
  ACTIONS_RUNNER_DEBUG: false
  # 关闭dockerbuild摘要工件、关闭默认溯源证明，避免镜像名称泄露
  DOCKER_BUILD_SUMMARY: false
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set date variable (Beijing time)
        run: echo "BUILD_DATE=$(date -d '+8 hour' +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ secrets.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_IMAGE_NAME }}:${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
